[package]
name = "chronogit"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A read-only terminal UI for Git history, diffs, and source code"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/karanabe/chronogit"
keywords = ["git", "tui", "terminal", "diff", "code"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/tests/**",
    "/config/**",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
]
publish = ["crates-io"]

[dependencies]
bstr = { version = "1.13.1", default-features = false, features = ["std"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
rustix = { version = "1.1.4", features = ["fs"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
