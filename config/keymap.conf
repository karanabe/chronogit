# Copy this file to $XDG_CONFIG_HOME/chronogit/keymap.conf
# (or ~/.config/chronogit/keymap.conf) and uncomment only the bindings to change.
[bindings]
# Space is ChronoGit's built-in application leader. A standalone Space action
# conflicts unless every remaining Space-prefixed action is also replaced.
# show_changes = space 1
# show_history = space 2
# show_graph = space 3
# show_code = space 4
# switch_branch = space b
# file_search = space f
# content_search = space g
# Ctrl-h/k and Ctrl-j/l focus the previous and next panes by default. Each
# assignment replaces every alias for that action, including all Ctrl-w forms;
# list every alias you want to retain when customizing either direction.
# focus_previous = ctrl-h, ctrl-k, ctrl-w h, ctrl-w k, ctrl-w ctrl-h, ctrl-w ctrl-k, ctrl-w backspace, ctrl-w W, ctrl-w left, ctrl-w up
# focus_next = ctrl-j, ctrl-l, ctrl-w j, ctrl-w l, ctrl-w ctrl-j, ctrl-w ctrl-l, ctrl-w w, ctrl-w ctrl-w, ctrl-w right, ctrl-w down
# cursor_left = h, left
# cursor_right = l, right
# cursor_left_wrap = backspace
# To restore the former Ctrl-h/Ctrl-j motion aliases, also replace the related
# focus action so the same key is not assigned twice; see the keymap reference.
# vim-navigation supports Vim's Space motion; ChronoGit leaves it unbound so
# Space can be the leader. Backslash remains available as a custom alternative.
# cursor_right_wrap = \
# word_forward = w
# word_backward = b
# move_top = g g, ctrl-home
# move_bottom = G
# move_bottom_end = ctrl-end
# page_up = ctrl-b, pageup
# page_down = ctrl-f, pagedown
# set_mark = m
# jump_mark_line = '
# jump_mark_exact = `
# lsp_hover = K
# symbol_context = space s
# open_full_file = space v
# toggle_full_file_mode = space d
# go_to_definition = g d
# go_to_implementation = g i
# go_to_type_definition = g y
# go_to_declaration = g D
# semantic_back = ctrl-o
# semantic_forward = ctrl-i, tab
# In History, toggle the bottom message/diff pane; elsewhere, toggle the message overlay.
# toggle_message = space m
# toggle_details = space B
# toggle_tree = space t
# activate = enter
# Leave close unset for default Esc: dismiss search highlights, then close/back.
# An explicit close assignment replaces q and Esc; all listed keys close immediately.
# close = q, esc
# quit = Q
