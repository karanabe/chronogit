# Copy this file to $XDG_CONFIG_HOME/chronogit/keymap.conf
# (or ~/.config/chronogit/keymap.conf) and uncomment only the bindings to change.
[bindings]
# Space is ChronoGit's built-in application leader. A standalone Space action
# conflicts unless every remaining Space-prefixed action is also replaced.
# show_changes = space 1
# show_history = space 2
# show_graph = space 3
# show_code = space 4
# file_search = space f
# content_search = space g
# cursor_left = h, left
# cursor_right = l, right
# cursor_left_wrap = backspace, ctrl-h
# vim-navigation supports Vim's Space motion; ChronoGit leaves it unbound so
# Space can be the leader. Backslash remains available as a custom alternative.
# cursor_right_wrap = \
# word_forward = w
# word_backward = b
# move_top = g g, ctrl-home
# move_bottom = G
# move_bottom_end = ctrl-end
# page_up = ctrl-b, pageup
# page_down = ctrl-f, pagedown
# set_mark = m
# jump_mark_line = '
# jump_mark_exact = `
# lsp_hover = K
# go_to_definition = g d
# go_to_implementation = g i
# go_to_type_definition = g y
# go_to_declaration = g D
# semantic_back = ctrl-o
# semantic_forward = ctrl-i, tab
# toggle_message = space m
# toggle_details = space b
# toggle_tree = space t
# activate = enter
# Leave close unset for default Esc: dismiss search highlights, then close/back.
# An explicit close assignment replaces q and Esc; all listed keys close immediately.
# close = q, esc
# quit = Q
